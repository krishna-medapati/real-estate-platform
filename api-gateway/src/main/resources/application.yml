server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: property-service
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/api/properties/**
        - id: visit-service
          uri: lb://VISIT-SERVICE
          predicates:
            - Path=/api/visits/**
        - id: inquiry-service
          uri: lb://INQUIRY-SERVICE
          predicates:
            - Path=/api/inquiries/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9000/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost
